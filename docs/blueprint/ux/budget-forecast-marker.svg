<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">预算推演：月度现金流与月末现金</title>
  <desc id="desc">示意预算页顶部推演面板：柱形按已发生、按预算计划、已排定三段区分，折线为后端返回的月末现金；未设预算月份显示为 6px 灰色短横线 +「未设预算」，不画 0 柱，折线断开且不用 0 或上期值连接。所有数值由后端计算，前端只展示。</desc>

  <style>
    .page { fill: #F6F6F4; }
    .card { fill: #FFFFFF; }
    .ink { fill: #14161A; }
    .ink2 { fill: #565A60; }
    .ink3 { fill: #63686E; }
    .track { fill: #A4A8A2; }
    .actual-in { fill: #2E8A57; }
    .actual-out { fill: #425B70; }
    .grid { stroke: #E4E4E0; stroke-width: 1; }
    .zero { stroke: #A4A8A2; stroke-width: 1.2; }
    .line { stroke: #565A60; stroke-width: 1.5; stroke-dasharray: 4 3; fill: none; }
    .dot { fill: #FFFFFF; stroke: #565A60; stroke-width: 1.2; }
    .gap-line { stroke: #A4A8A2; stroke-width: 6; stroke-linecap: round; }
    .gap-ring { fill: none; stroke: #A4A8A2; stroke-width: 1.2; stroke-dasharray: 3 2; }
    .chip { fill: #FFFFFF; stroke: #D8D8D3; stroke-width: 1; }
    .chip-on { fill: #14161A; stroke: #14161A; }
    .label { font: 13px/1.4 "Inter", "Noto Sans SC", system-ui, sans-serif; }
    .small { font: 12px/1.4 "Inter", "Noto Sans SC", system-ui, sans-serif; }
    .tiny { font: 11px/1.4 "Inter", "Noto Sans SC", system-ui, sans-serif; }
    .title { font: 600 16px/1.4 "Inter", "Noto Sans SC", system-ui, sans-serif; }
    .num { font-variant-numeric: tabular-nums; }
  </style>

  <defs>
    <pattern id="hatchIn" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#E8F3EC"/>
      <path d="M0,6 L6,0" stroke="#2E8A57" stroke-width="1.2"/>
    </pattern>
    <pattern id="hatchOut" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#E9EDF1"/>
      <path d="M0,6 L6,0" stroke="#425B70" stroke-width="1.2"/>
    </pattern>
    <pattern id="dotIn" width="5" height="5" patternUnits="userSpaceOnUse">
      <rect width="5" height="5" fill="#E8F3EC"/>
      <circle cx="1.5" cy="1.5" r="1" fill="#2E8A57"/>
    </pattern>
    <pattern id="dotOut" width="5" height="5" patternUnits="userSpaceOnUse">
      <rect width="5" height="5" fill="#E9EDF1"/>
      <circle cx="1.5" cy="1.5" r="1" fill="#425B70"/>
    </pattern>
  </defs>

  <rect class="page" x="0" y="0" width="960" height="620"/>
  <rect class="card" x="24" y="20" width="912" height="580" rx="16"/>

  <text class="title ink" x="48" y="56">预算推演：月度现金流与月末现金</text>

  <!-- 控制条 -->
  <rect class="chip-on" x="48" y="72" width="64" height="24" rx="12"/>
  <text class="small" fill="#FFFFFF" x="80" y="88" text-anchor="middle">现金流</text>
  <rect class="chip" x="118" y="72" width="48" height="24" rx="12"/>
  <text class="small ink2" x="142" y="88" text-anchor="middle">资产</text>

  <rect class="chip-on" x="706" y="72" width="48" height="24" rx="12"/>
  <text class="small" fill="#FFFFFF" x="730" y="88" text-anchor="middle">3 月</text>
  <rect class="chip" x="760" y="72" width="48" height="24" rx="12"/>
  <text class="small ink2" x="784" y="88" text-anchor="middle">6 月</text>
  <rect class="chip" x="814" y="72" width="56" height="24" rx="12"/>
  <text class="small ink2" x="842" y="88" text-anchor="middle">12 月</text>

  <text class="small ink2 num" x="48" y="114">起点现金 ¥12,400.00 · 基准日净资产 ¥86,500.00</text>

  <!-- 图例 -->
  <rect class="actual-in" x="48" y="132" width="16" height="10" rx="2"/>
  <text class="tiny ink2" x="70" y="141">已发生</text>
  <rect fill="url(#hatchIn)" stroke="#2E8A57" stroke-width="0.8" x="132" y="132" width="16" height="10" rx="2"/>
  <text class="tiny ink2" x="154" y="141">按预算计划</text>
  <rect fill="url(#dotIn)" stroke="#2E8A57" stroke-width="0.8" x="244" y="132" width="16" height="10" rx="2"/>
  <text class="tiny ink2" x="266" y="141">已排定</text>
  <line class="gap-line" x1="332" y1="137" x2="348" y2="137"/>
  <text class="tiny ink2" x="354" y="141">未设预算</text>
  <path class="line" d="M 442 137 L 468 137"/>
  <circle class="dot" cx="455" cy="137" r="3"/>
  <text class="tiny ink2" x="476" y="141">月末现金（后端值）</text>

  <!-- 坐标与网格 -->
  <line class="grid" x1="88" y1="318" x2="860" y2="318"/>
  <line class="grid" x1="88" y1="354" x2="860" y2="354"/>
  <line class="zero" x1="88" y1="390" x2="860" y2="390"/>
  <line class="grid" x1="88" y1="426" x2="860" y2="426"/>
  <line class="grid" x1="88" y1="462" x2="860" y2="462"/>

  <text class="tiny ink3 num" x="78" y="322" text-anchor="end">4,000</text>
  <text class="tiny ink3 num" x="78" y="358" text-anchor="end">2,000</text>
  <text class="tiny ink3 num" x="78" y="394" text-anchor="end">0</text>
  <text class="tiny ink3 num" x="78" y="430" text-anchor="end">-2,000</text>
  <text class="tiny ink3 num" x="78" y="466" text-anchor="end">-4,000</text>

  <text class="tiny ink3" x="88" y="306">流入 ↑</text>
  <text class="tiny ink3" x="88" y="484">流出 ↓</text>

  <!-- 11 月（当前月）：已发生 + 按预算计划 + 已排定 -->
  <rect class="actual-in" x="136" y="339.6" width="48" height="50.4" rx="2"/>
  <rect fill="url(#hatchIn)" stroke="#2E8A57" stroke-width="0.8" x="136" y="319.8" width="48" height="19.8"/>
  <rect fill="url(#dotIn)" stroke="#2E8A57" stroke-width="0.8" x="136" y="314.4" width="48" height="5.4"/>
  <rect class="actual-out" x="136" y="390" width="48" height="34.2" rx="2"/>
  <rect fill="url(#hatchOut)" stroke="#425B70" stroke-width="0.8" x="136" y="424.2" width="48" height="19.8"/>
  <rect fill="url(#dotOut)" stroke="#425B70" stroke-width="0.8" x="136" y="444" width="48" height="5.4"/>

  <!-- 12 月 -->
  <rect fill="url(#hatchIn)" stroke="#2E8A57" stroke-width="0.8" x="251" y="314.4" width="48" height="75.6" rx="2"/>
  <rect fill="url(#hatchOut)" stroke="#425B70" stroke-width="0.8" x="251" y="390" width="48" height="54" rx="2"/>

  <!-- 1 月 -->
  <rect fill="url(#hatchIn)" stroke="#2E8A57" stroke-width="0.8" x="366" y="314.4" width="48" height="75.6" rx="2"/>
  <rect fill="url(#hatchOut)" stroke="#425B70" stroke-width="0.8" x="366" y="390" width="48" height="54.9" rx="2"/>

  <!-- 2 月：未设预算缺口：6px 短横线 + 文案，不画 0 高柱 -->
  <line class="gap-line" x1="487" y1="390" x2="523" y2="390"/>
  <text class="small ink2" x="505" y="376" text-anchor="middle">未设预算</text>

  <!-- 3 月 -->
  <rect fill="url(#hatchIn)" stroke="#2E8A57" stroke-width="0.8" x="596" y="314.4" width="48" height="75.6" rx="2"/>
  <rect fill="url(#hatchOut)" stroke="#425B70" stroke-width="0.8" x="596" y="390" width="48" height="68.4" rx="2"/>

  <!-- 4 月 -->
  <rect fill="url(#hatchIn)" stroke="#2E8A57" stroke-width="0.8" x="711" y="314.4" width="48" height="75.6" rx="2"/>
  <rect fill="url(#hatchOut)" stroke="#425B70" stroke-width="0.8" x="711" y="390" width="48" height="64.8" rx="2"/>

  <!-- 月末现金折线：全部为后端返回值，缺口处断开 -->
  <path class="line" d="M 88 292.8 L 160 276.6 L 275 255 L 390 230.7"/>
  <path class="line" d="M 620 224.1 L 735 213.3"/>
  <circle class="dot" cx="88" cy="292.8" r="3.5"/>
  <circle class="dot" cx="160" cy="276.6" r="3.5"/>
  <circle class="dot" cx="275" cy="255" r="3.5"/>
  <circle class="dot" cx="390" cy="230.7" r="3.5"/>
  <circle class="dot" cx="620" cy="224.1" r="3.5"/>
  <circle class="dot" cx="735" cy="213.3" r="3.5"/>
  <circle class="gap-ring" cx="505" cy="220" r="5"/>
  <text class="tiny ink3" x="505" y="207" text-anchor="middle">无预算，折线断开</text>

  <text class="tiny ink3 num" x="88" y="284">12,400</text>
  <text class="tiny ink3 num" x="160" y="270">13,300</text>
  <text class="tiny ink3 num" x="275" y="248">14,500</text>
  <text class="tiny ink3 num" x="390" y="224">15,650</text>
  <text class="tiny ink3 num" x="620" y="217">16,050</text>
  <text class="tiny ink3 num" x="735" y="206">16,650</text>

  <!-- 月份标签 -->
  <text class="label ink2" x="160" y="532" text-anchor="middle">11月</text>
  <text class="label ink3" x="275" y="532" text-anchor="middle">12月</text>
  <text class="label ink3" x="390" y="532" text-anchor="middle">1月</text>
  <text class="label ink3" x="505" y="532" text-anchor="middle">2月</text>
  <text class="label ink3" x="620" y="532" text-anchor="middle">3月</text>
  <text class="label ink3" x="735" y="532" text-anchor="middle">4月</text>

  <!-- 选中月份明细 -->
  <text class="small ink2 num" x="48" y="562">11月：已发生 ¥2,800 · 按预算计划 ¥1,100 · 已排定 ¥300 · 月末现金 ¥13,300</text>
  <text class="tiny ink3" x="48" y="584">柱=当月现金流；折线=月末现金。数值全部由后端契约返回，前端不求和、不累计、不折算、不插值。</text>
</svg>
